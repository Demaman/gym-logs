services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: gym-logs-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gym-logs-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: gym-logs-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: CORS_ORIGINS
        sync: false   # set manually in the Render dashboard — your Vercel URL
      - key: MEDIA_BASE_URL
        sync: false   # set to your Render API URL, e.g. https://gym-logs-api.onrender.com
      - key: AI_API_KEY
        sync: false   # optional — only needed for AI program generation
      - key: AI_MODEL
        value: gemini-2.0-flash
      - key: AI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/

  # ── Frontend ─────────────────────────────────────────────────────────────────
  - type: web
    name: gym-logs-frontend
    runtime: node
    rootDir: frontend
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false   # set to your Render API URL, e.g. https://gym-logs-api.onrender.com

  # ── Redis ─────────────────────────────────────────────────────────────────────
  - type: redis
    name: gym-logs-redis
    plan: free
    maxmemoryPolicy: allkeys-lru

# ── PostgreSQL ─────────────────────────────────────────────────────────────────
databases:
  - name: gym-logs-db
    plan: free
    databaseName: gymlogs
    user: gymlogs
